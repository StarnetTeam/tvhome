# Place this file at .github/workflows/build-apk.yml in your repository.
# It builds the APK on free GitHub runners and publishes it on the "latest-build" release,
# so the TV can download it with the Downloader app.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/tvhome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: out/tvhome.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (test APK)
          prerelease: true
          files: out/tvhome.apk
